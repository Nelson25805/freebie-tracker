name: Fetch Free Games Data

on:
  schedule:
    # Runs at 08:00, 14:00, and 20:00 UTC daily
    # This covers morning, afternoon, and evening refreshes
    - cron: "0 8 * * *"
    - cron: "0 14 * * *"
    - cron: "0 20 * * *"

  workflow_dispatch:

permissions:
  contents: write

# Two scheduled runs overlapping (or a manual run landing mid-schedule) can
# each check out the same base commit and then race to push — whichever
# loses gets the "fetch first" rejection. Queue runs instead of letting them
# run concurrently, so each one always starts from the latest main.
concurrency:
  group: "fetch-free-games"
  cancel-in-progress: false

jobs:
  fetch-games:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install
        working-directory: scripts

      # NEW: Install Playwright Chromium browser
      - name: Install Playwright browsers
        run: npx --yes playwright install --with-deps chromium
        working-directory: scripts

      - name: Fetch free games data
        run: node fetch-games.js
        working-directory: scripts
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          FETCH_SECRET: ${{ secrets.FETCH_SECRET }}

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/games.json data/history

          # Only commit if the file actually changed
          if git diff --staged --quiet; then
            echo "No changes to games data, skipping commit."
            exit 0
          fi

          git commit -m "chore: refresh free games data"

          # main can move between checkout and push (a manual push, or an
          # overlapping run slipping past the concurrency guard). Rebase
          # our one data commit onto the latest main and retry a few times
          # rather than failing the whole run over a push race.
          attempt=1
          max_attempts=5
          until git push; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::Push still failing after $attempt attempts, giving up."
              exit 1
            fi
            echo "Push rejected (attempt $attempt/$max_attempts) — pulling and rebasing, then retrying…"
            git pull --rebase origin main
            attempt=$((attempt + 1))
          done
