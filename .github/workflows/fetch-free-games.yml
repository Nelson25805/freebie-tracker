name: Fetch Free Games Data

on:
  schedule:
    # Runs at 08:00, 14:00, and 20:00 UTC daily
    - cron: "0 8 * * *"
    - cron: "0 14 * * *"
    - cron: "0 20 * * *"

  workflow_dispatch:

permissions:
  contents: write

# Queue runs instead of letting them run concurrently, so each one always
# starts from the latest main.
concurrency:
  group: "fetch-free-games"
  cancel-in-progress: false

jobs:
  fetch-games:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install
        working-directory: scripts

      - name: Install Playwright browsers
        run: npx --yes playwright install --with-deps chromium
        working-directory: scripts

      # Fetches data and writes data/games.json + history. It does NOT email
      # subscribers anymore; it only records which games are new in
      # scripts/.pending-notify.json (never committed). Emails are sent in
      # the "Notify subscribers" step below, after a successful push.
      - name: Fetch free games data
        run: node fetch-games.js
        working-directory: scripts

      - name: Commit and push updated data
        id: commit
        env:
          # "false": a push that still fails after all retries becomes a
          #          warning (the next scheduled run regenerates the data).
          # "true":  a push that still fails fails the whole run.
          STRICT_PUSH: "false"
        run: |
          echo "pushed=false" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/games.json data/history

          # Only commit if the file actually changed
          if git diff --staged --quiet; then
            echo "No changes to games data, skipping commit."
            exit 0
          fi

          git commit -m "chore: refresh free games data"

          # GitHub occasionally returns "Internal Server Error" on push, and
          # main can also move between checkout and push. Retry with growing
          # delays (10s, 40s, 90s, 160s = ~5 min total) so a server-side blip
          # has time to clear, rebasing before each retry.
          attempt=1
          max_attempts=5
          until git push; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              if [ "$STRICT_PUSH" = "true" ]; then
                echo "::error::Push still failing after $attempt attempts, giving up."
                exit 1
              fi
              echo "::warning::Push still failing after $attempt attempts (likely a GitHub-side issue). Skipping; the next scheduled run will regenerate and retry."
              exit 0
            fi

            delay=$((attempt * attempt * 10))
            echo "Push rejected (attempt $attempt/$max_attempts) — waiting ${delay}s, then rebasing and retrying…"
            sleep "$delay"

            if ! git pull --rebase origin main; then
              echo "::warning::Rebase failed, aborting it and retrying the push as-is."
              git rebase --abort || true
            fi

            attempt=$((attempt + 1))
          done

          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Only runs if the data was actually pushed. If the push failed, the
      # repo's games.json is still the old version, so the next run will see
      # these games as "new" again and notify then, with no duplicates.
      - name: Notify subscribers
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        run: node send-pending-notify.js
        working-directory: scripts
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          FETCH_SECRET: ${{ secrets.FETCH_SECRET }}