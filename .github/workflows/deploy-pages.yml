name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Fetch Free Games Data"]
    types: [completed]
  workflow_dispatch:

# Avoid overlapping deployments — a new push cancels any in-flight deploy
# instead of queuing behind it (this was one of the causes of hangs).
concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Change this if your site files (index.html, app.js, styles.css,
          # data/games.json) live in a subfolder instead of the repo root.
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # The default timeout can cancel a deployment moments before
          # GitHub's backend confirms it succeeded, marking it "Failed to
          # deploy (completed)" even though the artifact is already live.
          # Give it more headroom.
          timeout: 1200000 # 20 minutes, in ms
