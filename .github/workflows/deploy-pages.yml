name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Fetch Free Games Data"]
    types: [completed]
  workflow_dispatch:

# Queue deployments instead of cancelling an in-flight one. Cancelling a
# deploy while Pages is mid-"updating_pages" can leave the deployment stuck,
# which makes later runs hang until they time out.
concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Change this if your site files (index.html, styles.css,
          # data/games.json) live in a subfolder instead of the repo root.
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # 600000 ms (10 minutes) is the maximum the action accepts; larger
          # values are silently reduced to this.
          timeout: 600000